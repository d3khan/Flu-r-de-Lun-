{% load static i18n humanize %}
{# Order summary. Params: flat (bool) — renders without card chrome for drawer footer #}
<div class="summary-card{% if flat %} summary-card--flat{% endif %}">
    <div class="summary-row">
        <span>{% trans "Subtotal" %}</span>
        <span>₦{{ cart.total_price|intcomma }}</span>
    </div>
    <div class="summary-row summary-row--total">
        <span>{% trans "Total" %}</span>
        <span>₦{{ cart.grand_total|intcomma }}</span>
    </div>
    <p class="summary-note">{% trans "Receiving arrangements are confirmed on WhatsApp." %}</p>
</div>
